site_name: gridfm-datakit-distr
site_description: Machine-learning datasets of power flows in three-phase unbalanced distribution networks
repo_url: https://github.com/gridfm/gridfm-datakit-distr
copyright: Copyright 2026 <a href="https://www.vicomtech.org">Vicomtech</a> · developed by the Energy and Environment department of Vicomtech, maintained by Carmine Delle Femine (<a href="https://github.com/cardef">@cardef</a>) · Apache License 2.0
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
validation:
  anchors: warn
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Home: index.md
  - Installation: installation.md
  - Manual:
      - Getting started: manual/getting_started.md
      - Networks: manual/networks.md
      - Variants: manual/variants.md
      - Scenarios: manual/scenarios.md
      - OPF labels: manual/opf.md
      - Outputs: manual/outputs.md
      - Configuration reference: manual/config.md
      - Command-line reference: manual/cli.md
