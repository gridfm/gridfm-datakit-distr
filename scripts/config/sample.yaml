# The v0.2 sample dataset: IEEE 13 (MV, three-wire) and the EDP rural MV/LV network (four-wire LV with
# an explicit neutral, 2731 single-phase customers); both freely licensed, no CSIRO data. PV sized for
# households: EDP rural customers draw 0.40 kW on average, and PV of 2-6 kWp already reverses the
# feeders and raises the neutral to 14 % of the phase voltage (the default is 0.5-10 kWp, larger).
# It carries OPF labels as well as power flow labels, so it needs the `opf` extra.
# Unlisted keys take their defaults: docs/manual/config.md.
dataset_name: gridfm_distr_sample_v0_2
networks:
  include: [ieee13, edp/rural]
variants:
  n_variants: 2
  admittance:
    line_length_scale: {distribution: uniform, low: 0.9, high: 1.1}
  phase_reallocation:
    enabled: true
    fraction: 0.2
der:
  pv:
    penetration: {distribution: uniform, low: 0.0, high: 0.3}
    kwp: {distribution: uniform, low: 1.0, high: 3.0}
scenarios:
  n_scenarios_per_variant: 200
labels:
  opf:
    enabled: true
    time_limit_s: 14400 # above any solve here: the wall-clock limit must not decide a label
settings:
  seed: 2026
  chunk_size: 100
